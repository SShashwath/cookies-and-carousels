services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: foodmatch
      POSTGRES_USER: foodmatch
      POSTGRES_PASSWORD: foodmatch
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - foodmatch-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodmatch -d foodmatch"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  foodmatch-data:
